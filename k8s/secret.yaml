apiVersion: v1
kind: Secret
metadata:
  name: fapi-qexec-secrets
type: Opaque
stringData:
  # Database env vars (replace values with your secure creds)
  DB_DRIVER: "oracle+oracledb"
  DB_USER: "REPLACE_WITH_USER"
  DB_PASS: "REPLACE_WITH_PASSWORD"
  DB_HOST: "REPLACE_WITH_HOST"
  DB_PORT: "1977"
  DB_SERVICE: "REPLACE_WITH_SERVICE"
  # Optionally set a full DATABASE_URL instead of the individual DB_* vars
  # DATABASE_URL: "oracle+oracledb://user:pass@host:port/?service_name=..."
